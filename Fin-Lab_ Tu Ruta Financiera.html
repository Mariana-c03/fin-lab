function init(){G={scr:'title',tut:0,name:'',av:AV[0],started:0,month:1,cash:300,savings:200,assets:0,score:640,stress:25,card:0,cardPrev:0,cardItems:[],used:[],limit:1000,loans:[],nextPen:0,streak:0,badges:{},hist:[],bud:{},ev:[],evi:0,pick:null,res:null,newB:[],prev:null};render(true);}

function startGame(){G.started=1;startMonth();go('map');}
const fx=o=>{const c=-(o.e.cash||0);if(c>0&&G.cash<c&&G.savings>=c){const e={...o.e,fund:c};delete e.cash;return {...o,l:o.l.replace('cartera','hucha'),s:`Tu cartera no alcanza: pagas $${c} de tu hucha`,e};}return o;};
const spend=a=>{const t=Math.min(G.cash,a);G.cash-=t;G.savings-=a-t;};
function draw(l,n){let a=l.filter(e=>!G.used.includes(e.k));if(a.length<n){G.used=G.used.filter(k=>!l.some(e=>e.k===k));a=l.slice();}a.sort(()=>Math.random()-.5);const r=a.slice(0,n);r.forEach(e=>G.used.push(e.k));return r;}
function startMonth(){
  G.income=INCOME-G.nextPen;G.nextPen=0;G.fixedMin=Math.ceil((BASE+loanPay())/50)*50;
  const r=G.income-G.fixedMin,sv=Math.min(100,r);G.bud={fixed:G.fixedMin,save:sv,life:Math.min(100,r-sv)};
  G.snap={score:G.score,cash:G.cash,stress:G.stress};
  const pool=EVENTS.filter(e=>!e.trap&&!['phone','trip','gig','bonus'].includes(e.k)),tr=EVENTS.filter(e=>e.trap);
  G.ev=G.month===1?[EVENTS[0],EVENTS[1],...draw(tr,1),...draw(pool,1)]:[...draw(tr,1),...draw(pool,3)].sort(()=>Math.random()-.5);
  G.evi=0;G.pick=null;
}
function settle(){
  if(G.cash<0){const u=Math.min(G.savings,-G.cash);G.savings-=u;G.cash+=u;
    if(G.cash<0){G.cardItems.push({n:'⚠️ Faltante por falta de dinero',a:Math.round(-G.cash)});G.card+=-G.cash;G.cash=0;G.score-=40;G.stress+=20;sfx(180,.3);}}

}

  const cur=[G.cash,G.score,G.stress,net()];

function chips(e){const c=[];if(e.cash)c.push(`💵 ${e.cash>0?'+':''}${fmt(e.cash)}`);if(e.fund)c.push(`🐷 -${fmt(e.fund)} de la hucha`);if(e.sav)c.push(`🐷 +${fmt(e.sav)} ahorrados`);if(e.card)c.push(`💳 +${fmt(e.card)} de deuda`);if(e.loan)c.push(`📅 ${e.loan.n} cuotas de ${fmt(e.loan.amt/e.loan.n)} = ${fmt(e.loan.amt)} en total`);if(e.asset)c.push(`🎁 Objeto de ${fmt(e.asset)}`);if(e.stress)c.push(`${e.stress>0?'😰':'😊'} Estrés ${e.stress>0?'+':''}${e.stress}%`);if(e.bad)c.push('🎭 Nunca recibiste nada a cambio');if(e.score)c.push(`⭐ ${e.score>0?'+':''}${e.score} puntos`);if(e.pen)c.push(`📉 Ganarás ${fmt(e.pen)} menos`);return (c.length?c:['Sin cambios']).map(x=>`<span class="chip">${x}</span>`).join('');}

 <button class="opt" onclick="payCard('skip')"><b>🔴 No pagar</b><span>Mora: -40 puntos, +15% estrés y multa de $15</span></button>
 <div class="mt-4 p-3 rounded-2xl" style="background:color-mix(in srgb,var(--rd) 12%,var(--sf))">🔮 <b>Si solo pagaras el mínimo siempre,</b> terminarías pagando <b style="color:var(--rd)">${fmt(pv.total)}</b> por una deuda de ${fmt(b)} (¡${fmt(pv.total-b)} de intereses y cerca de ${(pv.months/12).toFixed(1)} años!).</div></div>`;},
p3r(){const r=G.res;return `${mascot(r.msg,r.mood)}<div class="card text-center"><div style="font-size:3.5rem">${r.ic}</div><div>${r.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div>${G.extra?`<div class="alert mt-3">${G.extra}</div>`:''}<button class="btn mt-5" onclick="go('p4');${G.stars===3||G.newB.length?'confetti()':''}">Ver mi resumen del mes</button></div>`;},
p4(){const s=G.snap,n=Math.max(0,net()),d=(a,b,u='',inv)=>{const x=Math.round(b-a);return `<b style="color:${x===0?'var(--mu)':(inv?x<0:x>0)?'var(--gr)':'var(--rd)'}">${x>0?'+':''}${x}${u}</b>`};
 const goals=GOALS.map(([i,t,v])=>{const p=Math.min(100,n/v*100);return `<div class="mt-2"><div class="flex justify-between sm"><span>${i} ${t}</span><span class="num">${fmt(Math.min(n,v))} / ${fmt(v)}${p>=100?' ✔':''}</span></div><div class="bar"><i style="width:${p}%;background:${p>=100?'var(--gr)':'var(--bl)'}"></i></div></div>`}).join('');
 const bd=BADGES.map(([k,i,t,x])=>`<div class="card badge ${G.badges[k]?'on':''} !p-3 text-center"><div class="text-3xl">${i}</div><b class="sm">${t}</b><div class="mu sm">${x}</div></div>`).join('');
 return `${mascot(G.stars===3?'¡¡3 estrellas!! ¡Eres un genio del dinero!':G.stars===2?'¡Buen mes! Sigue mejorando.':'Este mes fue difícil, ¡pero aprendes con cada decisión!',G.stars>1?'good':'bad')}
 ${G.newB.length?`<div class="card text-center mb-3" style="border-color:var(--yl)">🎉 <b>¡Nueva insignia: ${G.newB.map(k=>BADGES.find(b=>b[0]===k)[2]).join(', ')}!</b></div>`:''}
 <div class="card text-center"><div style="font-size:3rem">${'⭐'.repeat(G.stars)}${'☆'.repeat(3-G.stars)}</div><div class="grid grid-cols-3 gap-2 mt-2"><div><div class="mu sm">Puntos</div><b>${G.score}</b> ${d(s.score,G.score)}</div><div><div class="mu sm">Cartera</div><b>${fmt(G.cash)}</b> ${d(s.cash,G.cash)}</div><div><div class="mu sm">Estrés</div><b>${Math.round(G.stress)}%</b> ${d(s.stress,G.stress,'%',1)}</div></div></div>
 <div class="card mt-3"><h3 class="font-extrabold">🎯 Tus metas</h3>${goals}</div><h3 class="font-extrabold mt-3 mb-2">🏅 Tus insignias</h3><div class="grid grid-cols-3 gap-2">${bd}</div>
 <div class="text-center mt-4"><button class="btn !text-xl" onclick="nextMonth()">${G.month===12?'¡Ver mi informe final!':'Siguiente mes ➡️'}</button></div>`;},
over(){const n=net();return `${mascot('Tu estrés llegó al 100%. Las deudas y los gastos te agotaron. ¡Pero se aprende intentando!','bad')}<div class="card text-center"><div style="font-size:4.5rem">😵</div><h2 class="text-3xl font-extrabold">¡Game over!</h2><p class="mu">${G.name}, llegaste hasta el mes ${G.month} de 12.</p>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3"><div><div class="mu sm">Patrimonio</div><b>${fmt(n)}</b></div><div><div class="mu sm">Puntos</div><b>${G.score}</b></div><div><div class="mu sm">Deudas</div><b>${fmt(debt())}</b></div><div><div class="mu sm">Estrellas</div><b>${G.hist.reduce((a,b)=>a+b,0)}</b></div></div>
<p class="mt-3">💡 ${debt()>300?'Las deudas suben el estrés cada mes: paga la tarjeta completa y evita compras a cuotas.':'Cuida tu diversión y tu ahorro, y no te quedes sin dinero en la cartera.'}</p><button class="btn bl mt-5" onclick="init()">Intentar de nuevo 🔁</button></div>`;},
final(){const n=net(),sc=G.score;
 const g=sc>=750&&n>=3000?['Maestro financiero','🏆']:sc>=670&&n>=1000?['Ahorrador estrella','🌟']:sc>=580?['Aprendiz en progreso','🌱']:['Practicante de riesgo','🛟'];
 const tot=G.hist.reduce((a,b)=>a+b,0);
 return `${mascot(`¡Lo lograste, ${G.name}! Terminaste el año con ${tot} estrellas.`,'good')}<div class="card text-center"><div style="font-size:4.5rem">${g[1]}</div><h2 class="text-3xl font-extrabold">${G.av} ${G.name}: ${g[0]}</h2>
 <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3"><div><div class="mu sm">Patrimonio</div><b>${fmt(n)}</b></div><div><div class="mu sm">Puntos</div><b style="color:${scoreCol(sc)}">${sc}</b></div><div><div class="mu sm">Estrés</div><b>${Math.round(G.stress)}%</b></div><div><div class="mu sm">Deudas</div><b>${fmt(debt())}</b></div></div>
 <div class="mt-3 text-left">${GOALS.map(([i,t,v])=>`<div>${i} ${t}: ${n>=v?'<b style="color:var(--gr)">¡lograda!</b>':'<span class="mu">'+Math.round(Math.max(0,n)/v*100)+'%</span>'}</div>`).join('')}${BADGES.map(([k,i,t])=>`<div>${i} ${t}: ${G.badges[k]?'<b style="color:var(--gr)">¡ganada!</b>':'<span class="mu">pendiente</span>'}</div>`).join('')}</div>
 <button class="btn bl mt-5" onclick="init()">Jugar otra vez 🔁</button></div>`;}
};

function getPaid(){G.cash+=G.income;sfx(900);go('p1');}
function adj(k,d){G.bud[k]+=d;sfx(d>0?700:450,.08);render();}
function confirmBudget(){
  const b=G.bud;G.cash-=b.fixed+b.save+b.life;G.savings+=b.save;
  G.loans.forEach(l=>l.n--);G.loans=G.loans.filter(l=>l.n>0);
  if(b.life>=150)G.stress-=6;else if(b.life===0)G.stress+=6;
  if(b.save>=100)G.stress-=3;
  settle();sfx(900);go('p2');
}
function pick(j){
  const x=fx(G.ev[G.evi].o[j]);G.pickO=x;const e=x.e;G.cash+=e.cash||0;
  if(e.fund){const t=Math.min(G.savings,e.fund);G.savings-=t;G.cash-=e.fund-t;}
  if(e.card)G.cardItems.push({n:G.ev[G.evi].i+' '+G.ev[G.evi].t,a:e.card});G.savings+=e.sav||0;G.card+=e.card||0;G.assets+=e.asset||0;G.stress+=e.stress||0;G.score+=e.score||0;G.nextPen+=e.pen||0;const dS=(e.card||e.loan)?Math.min(10,Math.ceil((e.card||0)/40+(e.loan?e.loan.amt/60:0))):0;G.pickDS=dS;G.stress+=dS;
  if(e.loan)G.loans.push({pay:e.loan.amt/e.loan.n,n:e.loan.n});
  G.pick=j;settle();sfx(e.stress>=10||e.pen?250:800,.2);render(true);
}
function nextEv(){if(G.evi>=G.ev.length-1)go('p3');else{G.evi++;G.pick=null;render(true);}}
function stmt(){const it=G.cardItems,s=it.reduce((a,x)=>a+x.a,0),adj=Math.round(G.card-G.cardPrev-s),rows=[];if(G.cardPrev>0)rows.push(['📅 Saldo del mes anterior (con intereses)',G.cardPrev]);it.forEach(x=>rows.push([x.n,x.a]));if(Math.abs(adj)>=1)rows.push(['Otros ajustes',adj]);return `<div class="card mt-3 !p-3"><b>🧾 Extracto de tu tarjeta</b>${rows.map(r=>`<div class="flex justify-between sm mt-1"><span>${r[0]}</span><b>${fmt(r[1])}</b></div>`).join('')}<div class="flex justify-between mt-2"><b>Total a pagar</b><b>${fmt(G.card)}</b></div></div>`;}
function minPreview(b){let t=0,m=0;while(b>=1&&m<600){const p=b*.1;t+=p;b=(b-p)*1.05;m++;}return{total:t+b,months:m};}
function payCard(t){
  const b=G.card;let r;
  if(t==='none'){G.score+=3;r={mood:'good',ic:'😎',msg:'Sin deudas, ¡así se hace!',chips:['⭐ +3 puntos']};}
  if(t==='full'){spend(b);G.card=0;G.score+=15;G.streak++;r={mood:'good',ic:'🎉',msg:'¡Pagaste todo! Cero intereses y tu reputación sube.',chips:[`💵 -${fmt(b)}`,'⭐ +15 puntos']};sfx(1000,.25);}
  if(t==='min'){const p=Math.ceil(b*.1);spend(p);G.card=Math.round((b-p)*1.05);G.stress+=10;G.streak=0;r={mood:'bad',ic:'🐌',msg:'Solo pagaste el mínimo: la deuda sigue creciendo con intereses.',chips:[`💵 -${fmt(p)}`,'😰 +10% estrés',`💳 Saldo de la tarjeta: ${fmt(G.card)}`]};}
  if(t==='skip'){G.card=Math.round(b*1.05+15);G.score-=40;G.stress+=15;G.streak=0;r={mood:'bad',ic:'🚨',msg:'No pagar es mora: pierdes puntos y la deuda crece.',chips:['⭐ -40 puntos','😰 +15% estrés',`💳 Saldo de la tarjeta: ${fmt(G.card)}`]};sfx(180,.3);}
  G.cardPrev=G.card;G.cardItems=[];G.res=r;endMonth();
}
function endMonth(){
  const ds=Math.min(15,Math.round(debt()/120));G.stress=Math.max(0,G.stress-5+ds);G.extra='';if(ds>0)G.res.chips.push(`😰 Por tus deudas (tarjeta + cuotas: ${fmt(debt())}): +${ds}% estrés`);
  if(G.stress>85){G.score-=15;G.cash-=40;G.extra='Estás muy estresado: perdiste 15 puntos y $40 en gastos de salud.';}
  settle();const old={...G.badges};
  if(G.streak>=3)G.badges.zero=1;if(G.savings>=3*G.bud.fixed)G.badges.shield=1;if(G.score>750)G.badges.inv=1;
  G.newB=Object.keys(G.badges).filter(k=>!old[k]);
  const s=G.snap;G.stars=(G.score>=s.score?1:0)+(G.stress<50?1:0)+(G.cash>0?1:0);G.hist.push(G.stars);
  go('p3r');
}
function nextMonth(){if(G.month===12){go('final');confetti();return;}G.month++;startMonth();go('map');}
init();
</script>
